name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: uv sync --frozen --group dev
      - run: uv run pytest
      - run: uv build
      - name: Check separately installed wheel over stdio
        run: |
          uv venv .tmp/installed
          uv pip install --python .tmp/installed/bin/python dist/*.whl
          uv run python bin/smoke_stdio.py --server .tmp/installed/bin/nemu-ksef-mcp
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --frozen --group dev
      - run: uv export --frozen --all-groups --no-hashes --no-emit-project --format requirements-txt -o requirements-audit.txt
      - run: uv run pip-audit --requirement requirements-audit.txt --no-deps --progress-spinner off
